openapi: 3.1.0
info:
  title: Orders API
  version: 1.0.0
  description: >-
    Contract baseline for order creation and lookup. Authentication scheme,
    production server, price quote source and partner scopes are deployment
    decisions still requiring confirmation.
servers:
  - url: https://api.example.invalid
    description: Placeholder only; replace per environment.
security:
  - bearerAuth: []
paths:
  /v1/orders:
    post:
      operationId: createOrder
      summary: Create an order idempotently
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: Client-generated key scoped to authenticated tenant and operation.
          schema:
            type: string
            minLength: 8
            maxLength: 128
        - name: X-Correlation-Id
          in: header
          required: false
          schema: { type: string, maxLength: 128 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateOrderRequest' }
      responses:
        '201':
          description: Order accepted. The proof returns 201 for a new key.
          headers:
            Location: { schema: { type: string, format: uri-reference } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '200':
          description: Idempotent replay; returns the previously accepted order.
          headers:
            Idempotent-Replay: { schema: { type: boolean } }
        '400': { description: Invalid request or missing idempotency key. }
        '401': { description: Missing or invalid authentication. }
        '403': { description: Principal is not authorized for this tenant or operation. }
        '409': { description: Key was already used with a different request body. }
        '422': { description: Request is syntactically valid but violates domain rules. }
        '429': { description: Consumer quota exceeded. }
        '503': { description: Required quote/dependency is unavailable or timed out. }
  /v1/orders/{orderId}:
    get:
      operationId: getOrder
      summary: Retrieve an order by identifier
      parameters:
        - name: orderId
          in: path
          required: true
          schema: { type: string, format: uuid }
      responses:
        '200':
          description: Order found and visible to this principal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Order' }
        '401': { description: Missing or invalid authentication. }
        '403': { description: Principal is not authorized to view the order. }
        '404': { description: Order not found or not visible. }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    CreateOrderRequest:
      type: object
      additionalProperties: false
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: '#/components/schemas/OrderItemInput' }
    OrderItemInput:
      type: object
      additionalProperties: false
      required: [productId, description, quantity, unitPrice, currency]
      properties:
        productId: { type: string, minLength: 1, maxLength: 80 }
        description: { type: string, minLength: 1, maxLength: 300 }
        quantity: { type: integer, minimum: 1, maximum: 10000 }
        unitPrice: { type: number, minimum: 0, multipleOf: 0.01 }
        currency: { type: string, pattern: '^[A-Z]{3}$' }
    Order:
      type: object
      required: [orderId, status, createdAtUtc, items]
      properties:
        orderId: { type: string, format: uuid }
        status: { type: string, enum: [Accepted, Pending] }
        createdAtUtc: { type: string, format: date-time }
        items:
          type: array
          items: { $ref: '#/components/schemas/OrderItemSnapshot' }
    OrderItemSnapshot:
      allOf:
        - $ref: '#/components/schemas/OrderItemInput'
        - type: object
          properties:
            lineTotal: { type: number, minimum: 0 }
